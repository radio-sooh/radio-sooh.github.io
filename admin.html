<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Radio Sooh</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@300;400;600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bordo: #6B1A2A; --bordo-dark: #4A1019; --bordo-light: #9B2A3E;
    --azul: #1B3A5C; --azul-mid: #2E5F8A;
    --blanco: #FAF9F7; --gris: #E8E4DF; --texto: #1a1a1a; --muted: #666;
  }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--blanco); color: var(--texto); min-height: 100vh; }

  /* LOGIN */
  #pantalla-login {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bordo-dark);
  }
  .login-box {
    background: var(--blanco);
    padding: 2.5rem 2.2rem;
    width: 100%;
    max-width: 360px;
    border-top: 4px solid var(--bordo-light);
  }
  .login-box h1 { font-family: 'Bebas Neue', sans-serif; font-size: 2.8rem; letter-spacing: 0.18em; color: var(--bordo-dark); margin-bottom: 0.2rem; }
  .login-box p { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 1.8rem; }
  .login-box label { display: block; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--azul); font-weight: 600; margin-bottom: 0.4rem; }
  .login-box input { width: 100%; border: 1px solid var(--gris); padding: 0.65rem 0.9rem; font-family: 'Source Sans 3', sans-serif; font-size: 0.95rem; outline: none; margin-bottom: 1.2rem; transition: border-color 0.2s; }
  .login-box input:focus { border-color: var(--azul-mid); }
  .login-box button { width: 100%; background: var(--bordo); color: var(--blanco); border: none; padding: 0.7rem; font-family: 'Source Sans 3', sans-serif; font-size: 0.9rem; font-weight: 600; letter-spacing: 0.08em; cursor: pointer; text-transform: uppercase; transition: background 0.2s; }
  .login-box button:hover { background: var(--bordo-light); }
  .login-error { font-size: 0.8rem; color: var(--bordo-light); margin-top: -0.8rem; margin-bottom: 1rem; display: none; }

  /* ADMIN PANEL */
  #pantalla-admin { display: none; }

  header { background: var(--bordo-dark); border-bottom: 3px solid var(--bordo-light); padding: 1.6rem 2rem; display: flex; align-items: center; justify-content: space-between; }
  header .logo { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; letter-spacing: 0.18em; color: var(--blanco); text-decoration: none; }
  header .badge { background: var(--bordo-light); color: var(--blanco); font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; padding: 3px 10px; margin-left: 0.8rem; vertical-align: middle; }
  header .header-right { display: flex; align-items: center; gap: 1rem; }
  .btn-ver-sitio { color: rgba(255,255,255,0.5); text-decoration: none; font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; border: 1px solid rgba(255,255,255,0.2); padding: 0.35rem 0.9rem; transition: all 0.2s; }
  .btn-ver-sitio:hover { color: rgba(255,255,255,0.85); border-color: rgba(255,255,255,0.45); }
  .btn-salir { background: none; border: none; color: rgba(255,255,255,0.4); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; font-family: 'Source Sans 3', sans-serif; padding: 0; transition: color 0.2s; }
  .btn-salir:hover { color: rgba(255,255,255,0.75); }

  .admin-layout { max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem; display: grid; grid-template-columns: 1fr 340px; gap: 2.5rem; align-items: start; }

  /* FORMULARIO */
  .form-panel { border-top: 3px solid var(--bordo); padding-top: 1.4rem; }
  .form-panel h2 { font-family: 'Lora', serif; font-size: 1.2rem; color: var(--azul); margin-bottom: 1.4rem; }
  .campo { margin-bottom: 1.1rem; }
  .campo label { display: block; font-size: 0.72rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--azul); font-weight: 600; margin-bottom: 0.4rem; }
  .campo input, .campo textarea { width: 100%; border: 1px solid var(--gris); padding: 0.6rem 0.8rem; font-family: 'Source Sans 3', sans-serif; font-size: 0.95rem; color: var(--texto); background: #fff; outline: none; transition: border-color 0.2s; border-radius: 0; }
  .campo input:focus, .campo textarea:focus { border-color: var(--azul-mid); }
  .campo textarea { resize: vertical; min-height: 100px; }
  .upload-area { border: 1.5px dashed var(--gris); padding: 1rem; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; background: #fff; }
  .upload-area:hover { border-color: var(--azul-mid); background: #f5f8fb; }
  .upload-area input[type=file] { display: none; }
  .upload-area span { font-size: 0.82rem; color: var(--muted); display: block; }
  .upload-preview { margin-top: 0.7rem; max-width: 100%; max-height: 140px; object-fit: cover; display: none; border: 1px solid var(--gris); }
  .btn-publicar { background: var(--bordo); border: none; padding: 0.65rem 2rem; font-family: 'Source Sans 3', sans-serif; font-size: 0.88rem; font-weight: 600; cursor: pointer; color: var(--blanco); letter-spacing: 0.05em; text-transform: uppercase; transition: background 0.2s; margin-top: 0.5rem; }
  .btn-publicar:hover { background: var(--bordo-light); }

  /* LISTA NOTAS */
  .lista-panel { border-top: 3px solid var(--azul); padding-top: 1.4rem; }
  .lista-panel h2 { font-family: 'Lora', serif; font-size: 1.2rem; color: var(--azul); margin-bottom: 1.2rem; }
  .nota-item { padding: 0.9rem 0; border-bottom: 1px solid var(--gris); display: flex; align-items: flex-start; justify-content: space-between; gap: 0.8rem; }
  .nota-item-info { flex: 1; min-width: 0; }
  .nota-item-titulo { font-family: 'Lora', serif; font-size: 0.92rem; font-weight: 700; color: var(--texto); line-height: 1.3; margin-bottom: 0.2rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nota-item-meta { font-size: 0.7rem; color: #aaa; }
  .nota-item-thumb { width: 52px; height: 36px; object-fit: cover; flex-shrink: 0; border: 1px solid var(--gris); }
  .btn-borrar-nota { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 2px 5px; flex-shrink: 0; transition: color 0.2s; line-height: 1; }
  .btn-borrar-nota:hover { color: var(--bordo); }
  .lista-empty { font-size: 0.85rem; color: #bbb; font-style: italic; padding: 1rem 0; }
  .badge-total { background: var(--azul); color: #fff; font-size: 0.65rem; padding: 2px 7px; margin-left: 0.5rem; vertical-align: middle; }

  footer { border-top: 1px solid var(--gris); text-align: center; padding: 1.2rem; font-size: 0.7rem; color: #ccc; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 2rem; }

  @media (max-width: 700px) {
    .admin-layout { grid-template-columns: 1fr; }
    header { padding: 1.2rem 1rem; }
  }
</style>
</head>
<body>

<!-- PANTALLA LOGIN -->
<div id="pantalla-login">
  <div class="login-box">
    <h1>Radio Sooh</h1>
    <p>Panel de administración</p>
    <label for="inp-pass">Contraseña</label>
    <input type="password" id="inp-pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')intentarLogin()">
    <p class="login-error" id="login-error">Contraseña incorrecta.</p>
    <button onclick="intentarLogin()">Ingresar</button>
  </div>
</div>

<!-- PANEL ADMIN -->
<div id="pantalla-admin">
  <header>
    <div>
      <a href="index.html" class="logo">Radio Sooh</a>
      <span class="badge">Admin</span>
    </div>
    <div class="header-right">
      <a href="index.html" class="btn-ver-sitio" target="_blank">Ver sitio</a>
      <button class="btn-salir" onclick="salir()">Salir</button>
    </div>
  </header>

  <div class="admin-layout">
    <!-- FORMULARIO -->
    <div class="form-panel">
      <h2>Nueva nota</h2>
      <div class="campo">
        <label>Título</label>
        <input type="text" id="inp-titulo" placeholder="Titular de la nota...">
      </div>
      <div class="campo">
        <label>Bajada / Resumen</label>
        <input type="text" id="inp-bajada" placeholder="Una línea que resume la nota...">
      </div>
      <div class="campo">
        <label>Cuerpo de la nota</label>
        <textarea id="inp-cuerpo" placeholder="Escribí el contenido completo..."></textarea>
      </div>
      <div class="campo">
        <label>Imagen (opcional)</label>
        <div class="upload-area" onclick="document.getElementById('inp-imagen').click()">
          <input type="file" id="inp-imagen" accept="image/*" onchange="previewImagen(this)">
          <span id="upload-texto">Hacé clic para subir una imagen</span>
          <img id="upload-preview" class="upload-preview" alt="Preview">
        </div>
      </div>
      <button class="btn-publicar" onclick="publicar()">Publicar nota</button>
    </div>

    <!-- LISTA -->
    <div class="lista-panel">
      <h2>Notas publicadas <span class="badge-total" id="badge-total">0</span></h2>
      <div id="lista-notas"></div>
    </div>
  </div>

  <footer>Panel Admin — <span style="color:var(--bordo)">Radio Sooh</span></footer>
</div>

<script>
  const CLAVE = 'radiosooh_noticias';
  const PASS = 'Drogadipto12-';

  function cargar() { try { return JSON.parse(localStorage.getItem(CLAVE)) || []; } catch { return []; } }
  function guardar(n) { localStorage.setItem(CLAVE, JSON.stringify(n)); }
  function formatFecha(ts) { return new Date(ts).toLocaleDateString('es-AR', { day:'numeric', month:'long', year:'numeric' }); }

  function intentarLogin() {
    const val = document.getElementById('inp-pass').value;
    if (val === PASS) {
      sessionStorage.setItem('rs_auth', '1');
      mostrarAdmin();
    } else {
      document.getElementById('login-error').style.display = 'block';
      document.getElementById('inp-pass').value = '';
      document.getElementById('inp-pass').focus();
    }
  }

  function mostrarAdmin() {
    document.getElementById('pantalla-login').style.display = 'none';
    document.getElementById('pantalla-admin').style.display = 'block';
    renderLista();
  }

  function salir() {
    sessionStorage.removeItem('rs_auth');
    location.reload();
  }

  function comprimirImagen(file, callback) {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const MAX = 900;
        let w = img.width, h = img.height;
        if (w > MAX) { h = Math.round(h * MAX / w); w = MAX; }
        if (h > MAX) { w = Math.round(w * MAX / h); h = MAX; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        callback(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  function previewImagen(input) {
    const file = input.files[0];
    if (!file) return;
    comprimirImagen(file, dataUrl => {
      const preview = document.getElementById('upload-preview');
      preview.src = dataUrl;
      preview.style.display = 'block';
      document.getElementById('upload-texto').textContent = file.name;
    });
  }

  function publicar() {
    const titulo = document.getElementById('inp-titulo').value.trim();
    const bajada = document.getElementById('inp-bajada').value.trim();
    const cuerpo = document.getElementById('inp-cuerpo').value.trim();
    const preview = document.getElementById('upload-preview');
    const imagen = preview.style.display !== 'none' ? preview.src : '';
    if (!titulo) { alert('El título es obligatorio.'); return; }
    const noticias = cargar();
    noticias.unshift({ id: Date.now(), titulo, bajada, cuerpo, imagen });
    guardar(noticias);
    document.getElementById('inp-titulo').value = '';
    document.getElementById('inp-bajada').value = '';
    document.getElementById('inp-cuerpo').value = '';
    document.getElementById('inp-imagen').value = '';
    preview.style.display = 'none';
    document.getElementById('upload-texto').textContent = 'Hacé clic para subir una imagen';
    renderLista();
    alert('¡Nota publicada!');
  }

  function borrar(id) {
    if (!confirm('¿Eliminar esta nota?')) return;
    guardar(cargar().filter(n => n.id !== id));
    renderLista();
  }

  function renderLista() {
    const noticias = cargar();
    const cont = document.getElementById('lista-notas');
    document.getElementById('badge-total').textContent = noticias.length;
    if (noticias.length === 0) {
      cont.innerHTML = `<p class="lista-empty">Sin notas publicadas todavía.</p>`;
      return;
    }
    cont.innerHTML = noticias.map(n => `
      <div class="nota-item">
        <div class="nota-item-info">
          <div class="nota-item-titulo">${n.titulo}</div>
          <div class="nota-item-meta">${formatFecha(n.id)}</div>
        </div>
        ${n.imagen ? `<img class="nota-item-thumb" src="${n.imagen}" alt="">` : ''}
        <button class="btn-borrar-nota" onclick="borrar(${n.id})" title="Eliminar">×</button>
      </div>
    `).join('');
  }

  // Auto-login si ya está autenticado en esta sesión
  if (sessionStorage.getItem('rs_auth') === '1') mostrarAdmin();

  document.getElementById('inp-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') intentarLogin();
  });
</script>
</body>
</html>
