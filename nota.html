<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radio Sooh</title>
<meta id="og-title" property="og:title" content="Radio Sooh">
<meta id="og-desc" property="og:description" content="">
<meta id="og-img" property="og:image" content="">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Source+Sans+3:wght@300;400;600&family=Lora:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bordo: #6B1A2A; --bordo-dark: #4A1019; --bordo-light: #9B2A3E;
    --azul: #1B3A5C; --azul-mid: #2E5F8A;
    --blanco: #FAF9F7; --gris: #E8E4DF; --texto: #1a1a1a; --muted: #666;
  }
  body { font-family: 'Source Sans 3', sans-serif; background: var(--blanco); color: var(--texto); min-height: 100vh; }
  header { background: var(--bordo-dark); border-bottom: 3px solid var(--bordo-light); padding: 2.2rem 1rem 1.6rem; text-align: center; }
  header a { text-decoration: none; }
  header h1 { font-family: 'Bebas Neue', sans-serif; font-size: clamp(3.5rem, 10vw, 6.5rem); font-weight: 400; color: var(--blanco); letter-spacing: 0.18em; line-height: 1; }
  header .subtitulo { margin-top: 0.5rem; font-size: clamp(0.7rem, 1.8vw, 0.82rem); font-weight: 300; color: rgba(250,249,247,0.55); letter-spacing: 0.28em; text-transform: uppercase; font-style: italic; }
  nav { background: var(--azul); display: flex; align-items: center; padding: 0 2rem; height: 44px; }
  nav a { color: rgba(250,249,247,0.75); text-decoration: none; font-size: 0.78rem; letter-spacing: 0.15em; text-transform: uppercase; padding: 0 1.2rem; height: 44px; display: flex; align-items: center; }
  nav a:hover { color: var(--blanco); }
  main { max-width: 760px; margin: 0 auto; padding: 2.5rem 1.5rem; }
  .nota-imagen { width: 100%; max-height: 420px; object-fit: cover; display: block; margin-bottom: 1.8rem; }
  .nota-titulo { font-family: 'Lora', serif; font-size: clamp(1.8rem, 4vw, 2.6rem); font-weight: 700; color: var(--azul); line-height: 1.2; margin-bottom: 0.6rem; }
  .nota-bajada { font-size: 1.05rem; color: var(--muted); line-height: 1.6; margin-bottom: 0.8rem; font-style: italic; border-left: 3px solid var(--bordo); padding-left: 1rem; }
  .nota-meta { font-size: 0.78rem; color: #aaa; margin-bottom: 1.8rem; padding-bottom: 1.4rem; border-bottom: 1px solid var(--gris); }
  .nota-cuerpo { font-size: 1.05rem; line-height: 1.85; color: #333; white-space: pre-wrap; }
  .not-found { text-align: center; padding: 4rem 1rem; color: #bbb; }
  .not-found h2 { font-family: 'Lora', serif; color: var(--azul); margin-bottom: 0.5rem; font-size: 1.5rem; }
  .not-found a { color: var(--bordo); }
  footer { border-top: 1px solid var(--gris); text-align: center; padding: 1.5rem; font-size: 0.72rem; color: #bbb; letter-spacing: 0.1em; text-transform: uppercase; margin-top: 3rem; }
  footer span { color: var(--bordo); }
</style>
</head>
<body>

<header>
  <a href="index.html">
    <h1>Radio Sooh</h1>
    <p class="subtitulo">Donde las noticias llegan solas y nadie las pidió</p>
  </a>
</header>

<nav>
  <a href="index.html">← Inicio</a>
</nav>

<main id="main-content">
  <div style="text-align:center;padding:3rem;color:#aaa">Cargando...</div>
</main>

<footer><span>Radio Sooh</span> &nbsp;·&nbsp; Misiones, Argentina</footer>

<script>
  const slug = new URLSearchParams(window.location.search).get('slug');
  function formatFecha(ts) { return new Date(ts).toLocaleDateString('es-AR', { day:'numeric', month:'long', year:'numeric' }); }

  async function cargar() {
    const main = document.getElementById('main-content');
    if (!slug) { mostrarError(main); return; }
    try {
      const res = await fetch('noticias.json?_=' + Date.now());
      const noticias = await res.json();
      const nota = noticias.find(n => n.slug === slug);
      if (!nota) { mostrarError(main); return; }
      document.title = nota.titulo + ' — Radio Sooh';
      document.getElementById('og-title').setAttribute('content', nota.titulo);
      document.getElementById('og-desc').setAttribute('content', nota.bajada || '');
      if (nota.imagen) document.getElementById('og-img').setAttribute('content', nota.imagen);
      main.innerHTML = `
        ${nota.imagen ? `<img class="nota-imagen" src="${nota.imagen}" alt="${nota.titulo}">` : ''}
        <h1 class="nota-titulo">${nota.titulo}</h1>
        ${nota.bajada ? `<p class="nota-bajada">${nota.bajada}</p>` : ''}
        <p class="nota-meta">${formatFecha(nota.id)}</p>
        <div class="nota-cuerpo">${nota.cuerpo || ''}</div>
      `;
    } catch(e) {
      mostrarError(main);
    }
  }

  function mostrarError(main) {
    main.innerHTML = '<div class="not-found"><h2>Nota no encontrada</h2><p style="margin-top:.5rem"><a href="index.html">← Volver al inicio</a></p></div>';
  }

  cargar();
</script>
</body>
</html>
